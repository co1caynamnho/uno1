  <script>
    // 3. DÁN TOÀN BỘ CODE JAVASCRIPT GAME VÀO ĐÂY

    // 4. DÁN THÊM HÀM LƯU ĐIỂM VÀO CUỐI MỤC SCRIPT NÀY
    async function saveScoreToVercel(username, score) {
      try {
        const res = await fetch('/api/save-score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, score })
        });
        const data = await res.json();
        if (data.success) alert('Đã lưu điểm thành công!');
      } catch (err) {
        console.error('Lỗi lưu điểm:', err);
      }
    }
  </script>
